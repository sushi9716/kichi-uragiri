<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>基地の裏切り者</title>
<style>
:root{--bg:#0f1a26;--card:#1a2a3d;--ink:#eef3f8;--sub:#8fa3ba;--acc:#ff6b4a;--ok:#4ed1a1;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 16px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}
.scr{display:none;position:absolute;inset:0;padding:20px;overflow:auto;max-width:480px;margin:0 auto}
.scr.on{display:block}
#game.on{max-width:none;padding:0;overflow:hidden}
h1{font-size:32px;margin:28px 0 6px;line-height:1.2}
.sub{color:var(--sub);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:2px solid #34506e;background:var(--bg);color:var(--ink);margin:6px 0}
button{font:700 16px system-ui,"Hiragino Sans","Yu Gothic",sans-serif;border:2px solid transparent;border-radius:12px;padding:14px;background:var(--acc);color:#fff;width:100%;margin:6px 0;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border-color:#34506e}
button.sel{background:var(--ok);color:#06241a}
button:disabled{opacity:.4}
.code{font-size:56px;letter-spacing:8px;text-align:center;color:var(--ok);margin:4px 0}
#plist div{padding:6px 0;border-bottom:1px solid #2a4058}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;pointer-events:none}
#barw{top:10px;left:12px;right:12px;height:12px;background:#223549;border-radius:6px;overflow:hidden}
#bar{height:100%;width:0;background:var(--ok)}
#rl{top:30px;left:12px;font-size:14px;padding:4px 10px;border-radius:8px;background:var(--card)}
#zn{top:30px;right:12px;font-size:14px;color:var(--sub)}
#mg{top:64px;left:0;right:0;text-align:center;font-size:18px;text-shadow:0 2px 6px #000}
#dead{bottom:20px;left:0;right:0;text-align:center;color:var(--sub);display:none}
.gb{position:absolute;right:16px;width:92px;height:92px;border-radius:50%;padding:0;margin:0;font-size:16px;width:92px}
#br{bottom:24px;background:#3d7bd9}
#bk{bottom:128px}
#jb{position:absolute;width:100px;height:100px;border:3px solid rgba(255,255,255,.35);border-radius:50%;display:none;pointer-events:none}
.big{font-size:22px;text-align:center;margin:14px 0}
</style>
</head>
<body>

<div class="scr on" id="home">
<h1>基地の裏切り者</h1>
<p class="sub">3〜8人で遊ぶ、スマホ対戦の正体隠匿アクション。アカウントは不要です。</p>
<div class="card"><label>名前</label><input id="nm" maxlength="8" placeholder="例：たなか"></div>
<button id="mkb">部屋を作る</button>
<div class="card"><label>部屋の番号（4桁）</label><input id="cin" inputmode="numeric" maxlength="4" placeholder="1234"><button class="alt" id="jnb">入室する</button></div>
<p class="sub">ルール：市民は光る場所に立ってタスクを完了、うらぎり者は市民を倒す。遺体を見つけたら通報して、話し合いと投票で追放しよう。</p>
</div>

<div class="scr" id="lobby">
<h1>ロビー</h1><p class="sub">この番号をみんなに伝えてください</p>
<div class="code" id="code">----</div>
<div class="card"><div id="plist"></div></div>
<p class="sub" id="wait"></p>
<button id="start" style="display:none">ゲーム開始</button>
</div>

<div class="scr" id="game">
<canvas id="cv"></canvas>
<div class="hud" id="barw"><div id="bar"></div></div>
<div class="hud" id="rl"></div><div class="hud" id="zn"></div><div class="hud" id="mg"></div><div class="hud" id="dead">倒されました。観戦中です</div>
<div id="jb"></div>
<button class="gb" id="br">通報</button><button class="gb" id="bk">倒す</button>
</div>

<div class="scr" id="meet">
<h1>緊急会議</h1><p class="sub" id="mm"></p><p class="big" id="mt"></p>
<p class="sub">口頭で話し合って、怪しい人に投票しましょう。</p>
<div id="vl"></div>
</div>

<div class="scr" id="end">
<h1 id="ew"></h1><div class="card" id="er"></div>
<button id="back" style="display:none">ロビーに戻る</button>
<p class="sub" id="ewait"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=i=>document.getElementById(i),W=900,H=600,R=190,SP=150;
const COL=['#e4572e','#17a2b8','#f2b134','#7bc950','#a06cd5','#ff8fab','#4d6fff','#c9a27a'];
const STN=[[150,150],[450,150],[750,150],[150,450],[450,450],[750,450]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let peer,hc=null,isHost=false,me=0,role='crew',uiPh='home',hph='lobby';
let pl=[],names=[],S=null,disp=[],pr=[0,0,0,0,0,0],bodies=[],tm=0,msg='',msgT=0,key={},jv={x:0,y:0},joy=null,loop=false;
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));uiPh=id}
function inp(){const k=(a,b)=>(key[a]?1:0)-(key[b]?1:0);return{x:k('d','a')+k('ArrowRight','ArrowLeft')+jv.x,y:k('s','w')+k('ArrowDown','ArrowUp')+jv.y}}
addEventListener('keydown',e=>key[e.key.toLowerCase()==='arrowup'?'ArrowUp':e.key.length===1?e.key.toLowerCase():e.key]=1);
addEventListener('keyup',e=>key[e.key.toLowerCase()==='arrowup'?'ArrowUp':e.key.length===1?e.key.toLowerCase():e.key]=0);

/* ---------- ホスト(審判) ---------- */
const mk=(n,c)=>({n,x:450,y:300,alive:true,role:'crew',conn:c,dx:0,dy:0,vote:null,cd:0});
const sendAll=m=>pl.forEach(p=>p.conn&&p.conn.open&&p.conn.send(m));
function hostRoom(){
  if(typeof Peer==='undefined'){alert('通信部品（PeerJS）を読み込めませんでした。アプリ内のプレビューではなく、ネット上に置いたURLで開いてください。');return}
  if(peer)peer.destroy();
  isHost=true;const code=String(1000+Math.random()*9000|0);
  peer=new Peer('kichi-'+code);
  peer.on('open',()=>{$('code').textContent=code;pl=[mk($('nm').value.trim()||'ホスト',null)];me=0;lobbyMsg();setInterval(tick,50)});
  peer.on('error',e=>{if(e.type==='unavailable-id')hostRoom();else alert('接続エラー：'+e.type)});
  peer.on('connection',c=>{c.on('data',d=>hd(c,d));c.on('close',()=>drop(c))});
}
function lobbyMsg(){
  names=pl.map(p=>p.n);
  pl.forEach((p,i)=>p.conn&&p.conn.open&&p.conn.send({t:'ok',id:i}));
  sendAll({t:'l',names});lobbyUI();
}
function hd(c,d){
  const i=pl.findIndex(p=>p.conn===c);
  if(d.t==='j'){
    if(hph!=='lobby'||pl.length>=8){c.send({t:'no'});return}
    pl.push(mk(String(d.n||'ゲスト').slice(0,8),c));lobbyMsg();return}
  if(i<0)return;const p=pl[i];
  if(d.t==='i'){p.dx=+d.x||0;p.dy=+d.y||0}
  else if(d.t==='kill')doKill(i);
  else if(d.t==='rep')doRep(i);
  else if(d.t==='vote'&&hph==='meet'&&p.alive)p.vote=+d.v;
}
function drop(c){
  const i=pl.findIndex(p=>p.conn===c);if(i<0)return;
  if(hph==='lobby'){pl.splice(i,1);lobbyMsg()}else{pl[i].alive=false;pl[i].conn=null;pl[i].vote=null}
}
function place(){pl.forEach((p,i)=>{const a=i/pl.length*6.283;p.x=450+Math.cos(a)*70;p.y=300+Math.sin(a)*70;p.dx=p.dy=0})}
function startGame(){
  const k=pl.length>=6?2:1,ix=pl.map((_,i)=>i).sort(()=>Math.random()-.5);
  pl.forEach(p=>{p.role='crew';p.alive=true;p.vote=null;p.cd=5});
  ix.slice(0,k).forEach(i=>pl[i].role='imp');
  pr=[0,0,0,0,0,0];bodies=[];msg='';msgT=0;place();hph='play';
  pl.forEach(p=>p.conn&&p.conn.send({t:'r',role:p.role}));
  role=pl[0].role;S=null;disp=[];show('game');enterGame();
}
function doKill(i){
  const p=pl[i];if(hph!=='play'||!p||!p.alive||p.role!=='imp'||p.cd>0)return;
  let b=null,bd=60;
  pl.forEach((q,j)=>{if(q.alive&&q.role==='crew'){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;b=j}}});
  if(b===null)return;
  pl[b].alive=false;bodies.push([Math.round(pl[b].x),Math.round(pl[b].y),b]);p.cd=8;
}
function doRep(i){
  const p=pl[i];if(hph!=='play'||!p||!p.alive)return;
  if(!bodies.some(b=>Math.hypot(b[0]-p.x,b[1]-p.y)<90))return;
  hph='meet';tm=40;bodies=[];pl.forEach(q=>q.vote=null);place();msg=p.n+'さんが遺体を発見しました';msgT=3;
}
function endMeet(){
  const cnt={};pl.forEach(p=>{if(p.alive&&p.vote!==null&&p.vote>=0)cnt[p.vote]=(cnt[p.vote]||0)+1});
  let top=-1,mx=0,tie=false;
  for(const k in cnt){if(cnt[k]>mx){mx=cnt[k];top=+k;tie=false}else if(cnt[k]===mx)tie=true}
  if(top>=0&&!tie){const q=pl[top];q.alive=false;msg=q.n+'さんを追放しました（'+(q.role==='imp'?'うらぎり者でした':'市民でした')+'）'}
  else msg='誰も追放されませんでした';
  msgT=5;
  if(win())return;
  hph='play';place();pl.forEach(p=>p.cd=Math.max(p.cd,5));
}
function win(){
  const c=pl.filter(p=>p.alive&&p.role==='crew').length,m=pl.filter(p=>p.alive&&p.role==='imp').length;
  let w=null;if(m===0||pr.every(v=>v>=1))w='crew';else if(c<=m)w='imp';
  if(w){hph='end';const e={t:'end',win:w,roles:pl.map(p=>p.role)};sendAll(e);endUI(e)}
  return w;
}
function tick(){
  if(hph==='lobby'||hph==='end')return;
  const dt=.05;
  if(uiPh==='game'){const v=inp();pl[0].dx=v.x;pl[0].dy=v.y}
  if(hph==='play'){
    pl.forEach(p=>{
      const l=Math.hypot(p.dx,p.dy);
      if(l>0){const f=Math.min(1,l)*SP*dt/l;p.x=Math.max(10,Math.min(W-10,p.x+p.dx*f));p.y=Math.max(10,Math.min(H-10,p.y+p.dy*f))}
      p.cd=Math.max(0,p.cd-dt);
    });
    STN.forEach((s,i)=>{
      if(pr[i]>=1)return;
      const near=pl.some(p=>p.alive&&p.role==='crew'&&Math.hypot(p.x-s[0],p.y-s[1])<45);
      pr[i]=near?Math.min(1,pr[i]+dt/4):Math.max(0,pr[i]-dt/3);
    });
    if(win())return;
  }else if(hph==='meet'){
    tm-=dt;
    if(tm<=0||pl.filter(p=>p.alive).every(p=>p.vote!==null))endMeet();
    if(hph==='end')return;
  }
  if(msgT>0)msgT-=dt;
  const s={t:'s',ph:hph,ps:pl.map(p=>[Math.round(p.x),Math.round(p.y),p.alive?1:0]),bd:bodies,pr:pr.map(v=>Math.round(v*100)/100),tm:Math.ceil(tm),cd:pl.map(p=>Math.ceil(p.cd)),msg:msgT>0?msg:''};
  sendAll(s);apply(s);
}
function toLobby(){hph='lobby';pl.forEach(p=>{p.alive=true});lobbyMsg()}

/* ---------- ゲスト ---------- */
function joinRoom(){
  if(typeof Peer==='undefined'){alert('通信部品（PeerJS）を読み込めませんでした。アプリ内のプレビューではなく、ネット上に置いたURLで開いてください。');return}
  if(peer)peer.destroy();
  const code=$('cin').value.trim();isHost=false;
  peer=new Peer();
  peer.on('open',()=>{
    hc=peer.connect('kichi-'+code);
    hc.on('open',()=>{$('code').textContent=code;hc.send({t:'j',n:$('nm').value.trim()||'ゲスト'});setInterval(()=>{if(uiPh==='game'&&hc.open){const v=inp();hc.send({t:'i',x:v.x,y:v.y})}},50)});
    hc.on('data',gd);
    hc.on('close',()=>{alert('ホストとの接続が切れました');location.reload()});
  });
  peer.on('error',e=>alert('つながりません。番号を確認してください（'+e.type+'）'));
}
function gd(d){
  if(d.t==='ok')me=d.id;
  else if(d.t==='no'){alert('入室できません（ゲーム中か満員です）');location.reload()}
  else if(d.t==='l'){names=d.names;lobbyUI()}
  else if(d.t==='r'){role=d.role;S=null;disp=[]}
  else if(d.t==='s')apply(d);
  else if(d.t==='end')endUI(d);
}

/* ---------- 画面 ---------- */
function lobbyUI(){
  if(uiPh!=='lobby')show('lobby');
  $('plist').innerHTML=names.map((n,i)=>'<div style="color:'+COL[i%8]+'">● '+esc(n)+(i===0?'（ホスト）':'')+'</div>').join('');
  $('start').style.display=isHost&&names.length>=3?'block':'none';
  $('wait').textContent=isHost?(names.length<3?'3人以上で開始できます':''):'ホストの開始を待っています';
}
function apply(s){
  const u={play:'game',meet:'meet'}[s.ph];
  if(u&&uiPh!==u){show(u);if(u==='game')enterGame();else{S=s;enterMeet()}}
  S=s;
  s.ps.forEach((p,i)=>{if(!disp[i])disp[i]={x:p[0],y:p[1]}});
  if(uiPh==='meet'){$('mt').textContent='残り '+s.tm+' 秒';$('mm').textContent=s.msg}
}
function enterGame(){
  $('rl').textContent=role==='imp'?'あなたは「うらぎり者」':'あなたは「市民」';
  $('rl').style.color=role==='imp'?'#ff6b4a':'#4ed1a1';
  $('bk').style.display=role==='imp'?'block':'none';
  if(!loop){loop=true;rs();frame()}
}
function enterMeet(){
  $('vl').innerHTML='';
  if(!S||!S.ps[me]||!S.ps[me][2]){$('vl').innerHTML='<p class="sub">あなたは投票できません。議論を見守りましょう。</p>';return}
  S.ps.forEach((p,i)=>{if(p[2]&&i!==me){const b=document.createElement('button');b.className='alt';b.textContent=names[i];b.style.borderColor=COL[i%8];b.onclick=()=>vote(i,b);$('vl').appendChild(b)}});
  const k=document.createElement('button');k.className='alt';k.textContent='スキップ';k.onclick=()=>vote(-1,k);$('vl').appendChild(k);
}
function vote(v,b){
  document.querySelectorAll('#vl button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  if(isHost)pl[0].vote=v;else hc.send({t:'vote',v});
}
function endUI(e){
  show('end');
  $('ew').textContent=e.win==='crew'?'市民の勝ち！':'うらぎり者の勝ち！';
  $('er').innerHTML=names.map((n,i)=>'<div style="color:'+COL[i%8]+'">'+esc(n)+'：'+(e.roles[i]==='imp'?'うらぎり者':'市民')+'</div>').join('');
  $('back').style.display=isHost?'block':'none';
  $('ewait').textContent=isHost?'':'ホストがロビーに戻すのを待っています';
}

/* ---------- 描画・入力 ---------- */
const cv=$('cv'),cx=cv.getContext('2d');
function rs(){cv.width=cv.clientWidth;cv.height=cv.clientHeight}
addEventListener('resize',rs);
cv.addEventListener('pointerdown',e=>{if(joy)return;joy={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);const b=$('jb');b.style.display='block';b.style.left=(e.clientX-50)+'px';b.style.top=(e.clientY-50)+'px'});
cv.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;let x=(e.clientX-joy.x)/45,y=(e.clientY-joy.y)/45;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jv={x,y}});
const up=e=>{if(joy&&e.pointerId===joy.id){joy=null;jv={x:0,y:0};$('jb').style.display='none'}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function frame(){
  requestAnimationFrame(frame);
  if(uiPh!=='game'||!S||!S.ps[me])return;
  if(cv.width!==cv.clientWidth)rs();
  S.ps.forEach((p,i)=>{const d=disp[i];if(d){d.x+=(p[0]-d.x)*.4;d.y+=(p[1]-d.y)*.4}});
  const w=cv.width,h=cv.height,sc=Math.min(w,h)/430,m=disp[me],alive=S.ps[me][2]===1;
  cx.fillStyle='#0b121b';cx.fillRect(0,0,w,h);
  cx.save();cx.translate(w/2-m.x*sc,h/2-m.y*sc);cx.scale(sc,sc);
  for(let i=0;i<6;i++){const zx=(i%3)*300,zy=(i/3|0)*300;cx.fillStyle=i%2?'#16283a':'#1b3147';cx.fillRect(zx,zy,300,300);cx.fillStyle='rgba(255,255,255,.07)';cx.font='bold 120px system-ui';cx.textAlign='center';cx.fillText(i+1,zx+150,zy+185)}
  cx.strokeStyle='#5d7a99';cx.lineWidth=4;cx.strokeRect(0,0,W,H);
  STN.forEach((s,i)=>{const v=S.pr[i];cx.beginPath();cx.arc(s[0],s[1],17,0,6.283);cx.fillStyle=v>=1?'#4ed1a1':'#f2b134';cx.fill();if(v>0&&v<1){cx.beginPath();cx.arc(s[0],s[1],25,-1.57,-1.57+6.283*v);cx.strokeStyle='#fff';cx.lineWidth=5;cx.stroke()}});
  S.bd.forEach(b=>{cx.strokeStyle=COL[b[2]%8];cx.lineWidth=7;cx.beginPath();cx.moveTo(b[0]-12,b[1]-12);cx.lineTo(b[0]+12,b[1]+12);cx.moveTo(b[0]+12,b[1]-12);cx.lineTo(b[0]-12,b[1]+12);cx.stroke()});
  S.ps.forEach((p,i)=>{
    const d=disp[i];if(!d)return;
    if(i!==me){if(alive&&(!p[2]||Math.hypot(d.x-m.x,d.y-m.y)>R))return}
    cx.globalAlpha=p[2]?1:.4;
    cx.beginPath();cx.arc(d.x,d.y,15,0,6.283);cx.fillStyle=COL[i%8];cx.fill();
    if(i===me){cx.strokeStyle='#fff';cx.lineWidth=3;cx.stroke()}
    cx.fillStyle='#fff';cx.font='bold 13px system-ui';cx.textAlign='center';cx.fillText(names[i]||'',d.x,d.y+30);
    cx.globalAlpha=1;
  });
  cx.restore();
  if(alive){cx.beginPath();cx.rect(0,0,w,h);cx.arc(w/2,h/2,R*sc,0,6.283);cx.fillStyle='rgba(4,7,12,.95)';cx.fill('evenodd')}
  $('bar').style.width=(S.pr.reduce((a,b)=>a+b,0)/6*100)+'%';
  $('zn').textContent='いまの場所：'+(Math.min(2,m.x/300|0)+3*Math.min(1,m.y/300|0)+1)+'番の部屋';
  $('mg').textContent=S.msg||'';
  $('dead').style.display=alive?'none':'block';
  $('br').style.display=alive?'block':'none';
  if(role==='imp'){$('bk').style.display=alive?'block':'none';const c=S.cd[me];$('bk').textContent=c>0?'倒す '+c:'倒す';$('bk').style.opacity=c>0?.4:1}
}

/* ---------- ボタン ---------- */
$('mkb').onclick=hostRoom;
$('jnb').onclick=()=>{if(/^\d{4}$/.test($('cin').value.trim()))joinRoom();else alert('4桁の番号を入れてください')};
$('start').onclick=startGame;
$('back').onclick=toLobby;
$('bk').onclick=()=>isHost?doKill(0):hc.send({t:'kill'});
$('br').onclick=()=>isHost?doRep(0):hc.send({t:'rep'});
</script>
</body>
</html>
